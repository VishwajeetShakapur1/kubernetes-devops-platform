name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall app
      - run: python -m unittest discover -s app/tests -v

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        service: [order-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f docker/${{ matrix.service }}.Dockerfile -t ${{ matrix.service }}:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
